name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SITE_INDEXABLE: "false"
      VITE_WEB_URL: https://mono.example
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and frontend build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            apps/frontend/node_modules/.vite
            apps/frontend/node_modules/.cache
          key: ${{ runner.os }}-bun-assets-${{ hashFiles('**/bun.lock', 'packages/config/project.ts') }}
          restore-keys: |
            ${{ runner.os }}-bun-assets-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Lint and format
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build app
        run: bun run build

      - name: Verify frontend metadata and assets
        working-directory: apps/frontend
        run: bun run verify:build
