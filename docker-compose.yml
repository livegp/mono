name: mono

x-common-build: &common-build
  BUN_VERSION: ${BUN_VERSION:-1.3.14-alpine}

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        <<: *common-build
    environment:
      NODE_ENV: production
      API_PORT: 9001
      CORS_ORIGIN: http://localhost:${WEB_PORT:-9000}
    ports:
      - "${API_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging: *common-logging
    networks:
      - mono-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        <<: *common-build
        VITE_WEB_PORT: 9000
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:${WEB_PORT:-9000}}
        VITE_API_URL: http://localhost:${API_PORT:-9001}
        VITE_SITE_INDEXABLE: ${VITE_SITE_INDEXABLE:-false}
    ports:
      - "${WEB_PORT:-9000}:9000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging: *common-logging
    networks:
      - mono-network

  docs:
    profiles: [docs]
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        <<: *common-build
    ports:
      - "${DOCS_PORT:-6006}:6006"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:6006/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging: *common-logging
    networks:
      - mono-network

networks:
  mono-network:
    driver: bridge
